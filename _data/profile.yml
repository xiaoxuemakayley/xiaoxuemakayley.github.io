short_bio: >-
  <p>
    I am a Senior Lecturer at the School of Science and Technology, Hong Kong Metropolitan University. 
    Prior to joining HKMU, I received my Ph.D. from City University of Hong Kong under the supervision of Jacky Keung, 
    my M.Sc. from the Hong Kong University of Science and Technology, 
    and my B.E. and B.M. from Beijing University of Posts and Telecommunications. 
    During my doctoral studies, I served as a visiting researcher at UCL for six months, 
    supervised by Federica Sarro and Earl T. Barr.
  </p>
  <p>
My primary research interests lie in Intelligent Software Engineering, 
Software Security and Reliability, and the intersection of Computer Science and AI in education.
  </p>

